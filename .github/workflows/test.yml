name: Run Tests

# テストワークフロー - PRとpushで自動実行
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# 同時実行制御 - 同じブランチの新しいジョブが実行されたら古いものをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # EditModeテストジョブ
  test-editmode:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Git LFSのキャッシュ
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      # Libraryフォルダのキャッシュ（ビルド時間短縮）
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ShaderOptimizer/Library
          key: Library-ShaderOp-${{ hashFiles('ShaderOptimizer/Packages/manifest.json') }}
          restore-keys: |
            Library-ShaderOp-

      # Unity Test Runnerでテスト実行
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ShaderOptimizer
          unityVersion: 6000.0.30f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+ShaderOp.Runtime'

      # テスト結果のアップロード
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EditMode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 30

      # カバレッジレポートのアップロード
      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Coverage-results
          path: ${{ steps.tests.outputs.coveragePath }}
          retention-days: 30

  # PlayModeテストジョブ（将来的に統合テストを追加する場合）
  test-playmode:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ShaderOptimizer/Library
          key: Library-ShaderOp-${{ hashFiles('ShaderOptimizer/Packages/manifest.json') }}
          restore-keys: |
            Library-ShaderOp-

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ShaderOptimizer
          unityVersion: 6000.0.30f1
          testMode: PlayMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PlayMode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 30

  # テスト成功後のコメント投稿（PR限定）
  comment-results:
    name: Comment Test Results
    runs-on: ubuntu-latest
    needs: [test-editmode, test-playmode]
    if: github.event_name == 'pull_request'

    steps:
      - name: Download EditMode results
        uses: actions/download-artifact@v4
        with:
          name: EditMode-results
          path: editmode-results

      - name: Download Coverage results
        uses: actions/download-artifact@v4
        with:
          name: Coverage-results
          path: coverage-results

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // テスト結果の解析（簡易版）
            let comment = '## テスト結果\n\n';
            comment += '✅ EditMode Tests: Passed\n';
            comment += '✅ PlayMode Tests: Passed\n\n';
            comment += 'カバレッジレポートは Artifacts からダウンロードできます。\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
